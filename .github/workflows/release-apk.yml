name: Release APK

# Builds a signed release APK and attaches it to a GitHub Release.
# Signing material comes from repository secrets, never from the tree:
#   ANDROID_KEYSTORE_BASE64    base64 of the .jks
#   ANDROID_KEYSTORE_PASSWORD  store password
#   ANDROID_KEY_ALIAS          key alias
#   ANDROID_KEY_PASSWORD       key password
# API_BASE_URL defaults to production; override with the workflow input.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'API base URL baked into the APK'
        required: false
        default: 'https://exam.mts241alikhlash.sch.id/'
      tag:
        description: 'Release tag (e.g. v1.0.0). Required for workflow_dispatch.'
        required: true
      flavor:
        description: 'Product flavor: standard (no camera) or proctor (camera proctoring)'
        type: choice
        options:
          - proctor
          - standard
        default: proctor

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Restore keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is empty; cannot sign a release build." >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          # build.gradle.kts reads these via providers.gradleProperty(), which only
          # sees env vars prefixed ORG_GRADLE_PROJECT_. A bare API_BASE_URL is ignored
          # and the release build silently falls back to https://exam-api.invalid/.
          FLAVOR: ${{ inputs.flavor || 'proctor' }}
          ORG_GRADLE_PROJECT_API_BASE_URL: ${{ inputs.api_base_url || 'https://exam.mts241alikhlash.sch.id/' }}
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew ":app:assemble${FLAVOR^}Release" --no-daemon --stacktrace

      - name: Collect APK
        id: apk
        run: |
          set -euo pipefail
          flavor="${{ inputs.flavor || 'proctor' }}"
          apk=$(find "app/build/outputs/apk/${flavor}/release" -name '*.apk' -type f | head -1)
          if [ -z "$apk" ]; then
            echo "no release APK produced" >&2
            exit 1
          fi
          tag="${{ inputs.tag }}"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then tag="$GITHUB_REF_NAME"; fi
          name="mts241-exam-${flavor}-${tag}.apk"
          cp "$apk" "$RUNNER_TEMP/$name"
          echo "path=$RUNNER_TEMP/$name" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Guard against placeholder API URL
        env:
          APK: ${{ steps.apk.outputs.path }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/apkdex && cd /tmp/apkdex
          unzip -o "$APK" 'classes*.dex' >/dev/null
          if strings classes*.dex | grep -q 'exam-api.invalid'; then
            echo "APK still points at the exam-api.invalid placeholder." >&2
            echo "API_BASE_URL was not applied; check ORG_GRADLE_PROJECT_API_BASE_URL." >&2
            exit 1
          fi
          strings classes*.dex | grep -oE 'https://[a-z0-9.-]*mts241alikhlash[a-z0-9./-]*' | sort -u | head -5

      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
